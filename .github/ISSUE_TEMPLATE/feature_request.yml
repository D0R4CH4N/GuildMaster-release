name: 要望
description: こんな機能がほしい・ここを変えてほしい
title: "[要望] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ありがとうございます。すべてにお応えできるとは限りませんが、読ませていただきます。

        **API キーや `data/.env` の中身は貼らないでください。** Issues は誰でも読めます。
  - type: textarea
    id: idea
    attributes:
      label: ほしいもの・変えてほしいこと
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: どんなときに困っているか・うれしいか
  - type: input
    id: version
    attributes:
      label: 遊んでいる版 (わかれば)
      placeholder: "例: 1.0.0"
